# Render Blueprint — https://render.com → New → Blueprint → bu depoyu bağla
services:
  - type: web
    name: zoomspeak
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.headless true --server.address 0.0.0.0 --server.port $PORT --server.fileWatcherType none
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SONIOX_API_KEY
        sync: false  # gizli anahtar: repo'ya ASLA yazılmaz, Render panelinde elle girilir
